name: Windows Installer

on:
  push:
    tags: ['v*']

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Version aus Tag extrahieren (v1.2.3 -> 1.2.3)
        shell: bash
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Maven Build
        run: mvn -B clean package "-Drevision=${{ env.VERSION }}"

      - name: Staging-Verzeichnis vorbereiten
        shell: bash
        run: |
          mkdir staging
          cp target/Kennwertdatenbank.jar staging/

      - name: jpackage (EXE-Installer bauen)
        shell: bash
        run: |
          jpackage \
            --type exe \
            --name Kennwertdatenbank \
            --icon src/main/resources/logo.ico \
            --app-version "${{ env.VERSION }}" \
            --input staging \
            --main-jar Kennwertdatenbank.jar \
            --add-modules java.se,jdk.crypto.ec,jdk.unsupported \
            --win-shortcut \
            --win-menu \
            --win-dir-chooser \
            --win-upgrade-uuid "3be2d362-f995-40b1-92b5-332831933c9b" \
            --dest target/installer
          mv target/installer/*.exe "target/installer/Kennwertdatenbank-${{ env.VERSION }}.exe"

      - name: GitHub Release erstellen
        uses: softprops/action-gh-release@v2
        with:
          files: target/installer/*.exe
          generate_release_notes: true